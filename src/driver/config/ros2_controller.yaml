# Compatibility copy. The active Gazebo plugin loads this configuration from
# a1_controller/config/a1_controllers.yaml.
controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    a1_effort_controller:
      type: a1_low_level_controller/A1EffortController

a1_effort_controller:
  ros__parameters:
    reference_topic: /a1_low_level_controller/reference
    torque_limit: 33.5
    joints:
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
